<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book a train ticket – Task 1</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="ticket-card">
      <div class="ticket-header">
        Book a train ticket
      </div>
      <div class="ticket-body">
        <form action="#" method="get" id="ticketForm">
          <div class="trip-type-group" role="group" aria-label="Trip type">
            <input type="radio" class="btn-check" name="tripType" id="oneWay" value="oneway" checked>
            <label class="btn" for="oneWay">One way</label>

            <input type="radio" class="btn-check" name="tripType" id="roundTrip" value="round">
            <label class="btn" for="roundTrip">Round trip</label>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <div class="form-floating">
                <input type="text" class="form-control" id="from" name="from"
                       placeholder="From" required autocomplete="address-level2">
                <label for="from" class="required-mark">From</label>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-floating">
                <input type="text" class="form-control" id="to" name="to"
                       placeholder="To" required autocomplete="address-level2">
                <label for="to" class="required-mark">To</label>
              </div>
            </div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-4">
              <label for="departure" class="form-label required-mark">Departure</label>
              <input type="date" class="form-control" id="departure" name="departure" required>
            </div>
            <div class="col-md-4">
              <label for="return" class="form-label">Return</label>
              <input type="date" class="form-control" id="return" name="return">
            </div>
            <div class="col-md-4">
              <label for="passengers" class="form-label">Passengers</label>
              <select class="form-select" id="passengers" name="passengers" required>
                <option value="1" selected>1 adult</option>
                <option value="2">2 adults</option>
                <option value="3">3 adults</option>
                <option value="4">4 adults</option>
                <option value="5">5 adults</option>
                <option value="6">6 adults</option>
              </select>
            </div>
          </div>

          <fieldset class="mb-3">
            <legend class="form-label required-mark fs-6 mb-2">Carriage class</legend>
            <div class="d-flex flex-wrap gap-3 carriage-group">
              <div class="form-check">
                <input class="form-check-input" type="radio" name="carriage" id="seat"
                       value="seat" required>
                <label class="form-check-label" for="seat">Seat</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="carriage" id="coupe"
                       value="coupe">
                <label class="form-check-label" for="coupe">Coupe</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="carriage" id="sleeper"
                       value="sleeper">
                <label class="form-check-label" for="sleeper">Sleeper</label>
              </div>
            </div>
          </fieldset>

          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label for="phone" class="form-label required-mark">Phone</label>
              <div class="input-group phone-group">
                <span class="input-group-text" id="phonePrefix">+7</span>
                <input type="tel" class="form-control" id="phone" name="phone"
                       placeholder="701 234 56 78" required
                       aria-describedby="phonePrefix"
                       autocomplete="tel-national"
                       inputmode="tel">
              </div>
            </div>
            <div class="col-md-6">
              <label for="email" class="form-label required-mark">Email</label>
              <input type="email" class="form-control" id="email" name="email"
                     placeholder="name@example.com" required
                     autocomplete="email">
            </div>
          </div>

          <div class="mb-3">
            <div class="form-check form-switch mb-2">
              <input class="form-check-input" type="checkbox" role="switch" id="sms" name="sms" value="1">
              <label class="form-check-label" for="sms">Also send the ticket by SMS</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="agree" name="agree"
                     value="1" required>
              <label class="form-check-label required-mark" for="agree">
                I agree with the carriage rules
              </label>
            </div>
          </div>

          <div class="btn-row mt-4">
            <button type="reset" class="btn btn-clear">Clear</button>
            <button type="submit" class="btn btn-find">Find trains</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
