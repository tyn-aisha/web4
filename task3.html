<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserve a table – Fixed Form (Task 3)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap');

    body {
      font-family: 'Montserrat', system-ui, sans-serif;
      background-color: #F4F7F5;
      padding: 2rem 0;
    }

    .card {
      border: none;
      border-radius: 1rem;
      box-shadow: 0 8px 24px rgba(22, 48, 43, 0.1);
      max-width: 560px;
      margin: 0 auto;
    }

    .card-header {
      background-color: #0F6B5F;
      color: #fff;
      border-radius: 1rem 1rem 0 0 !important;
      font-weight: 600;
    }

    .form-label { font-weight: 500; }

    .btn-primary {
      background-color: #0F6B5F;
      border-color: #0F6B5F;
    }

    .btn-primary:hover,
    .btn-primary:focus {
      background-color: #0c584e;
      border-color: #0c584e;
    }

    .required-mark::after {
      content: " *";
      color: #dc3545;
    }

    :focus-visible {
      outline: 2px solid #F2A93B;
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="card-header py-3">
        <h1 class="h4 mb-0">Reserve a table</h1>
      </div>
      <div class="card-body p-4">
        <form action="#" method="post">
          <div class="mb-3">
            <label for="name" class="form-label required-mark">Your name</label>
            <input type="text" class="form-control" id="name" name="name"
                   required autocomplete="name" placeholder="Your name">
          </div>

          <div class="mb-3">
            <label for="email" class="form-label required-mark">Email</label>
            <input type="email" class="form-control" id="email" name="email"
                   required autocomplete="email" placeholder="Email">
          </div>

          <div class="mb-3">
            <label for="phone" class="form-label required-mark">Phone</label>
            <input type="tel" class="form-control" id="phone" name="phone"
                   required autocomplete="tel" placeholder="+7 701 234 56 78"
                   inputmode="tel">
          </div>

          <div class="mb-3">
            <label for="guests" class="form-label required-mark">Guests</label>
            <input type="number" class="form-control" id="guests" name="guests"
                   required min="1" max="20" step="1" value="2" inputmode="numeric">
          </div>

          <div class="mb-3">
            <label for="date" class="form-label required-mark">Date</label>
            <input type="date" class="form-control" id="date" name="date" required>
          </div>

          <fieldset class="mb-3">
            <legend class="form-label required-mark fs-6">Seating</legend>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="seating"
                     id="seating-inside" value="inside" required>
              <label class="form-check-label" for="seating-inside">Inside</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="seating"
                     id="seating-terrace" value="terrace">
              <label class="form-check-label" for="seating-terrace">Terrace</label>
            </div>
          </fieldset>

          <div class="mb-3">
            <label for="meal" class="form-label required-mark">Meal</label>
            <select class="form-select" id="meal" name="meal" required>
              <option value="" selected disabled>Choose…</option>
              <option value="lunch">Lunch</option>
              <option value="dinner">Dinner</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="comments" class="form-label">Comments</label>
            <textarea class="form-control" id="comments" name="comments"
                      rows="3" placeholder="Any special requests?"></textarea>
          </div>

          <div class="mb-4">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="terms" name="terms"
                     value="yes" required>
              <label class="form-check-label required-mark" for="terms">
                I agree to the terms
              </label>
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100">Reserve</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
